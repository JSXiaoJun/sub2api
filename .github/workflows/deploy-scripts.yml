name: Deploy scripts

# 只校验 deploy/ 下的脚本。刻意与主 CI 拆开：这一组需要 macOS arm64 runner
# （apple container 只支持 Apple Silicon，apple-container.sh 里用的是 BSD stat），
# 而 macOS arm64 经常排队拿不到 runner（"The job was not acquired by Runner of
# type hosted"），不应该因此让整个主 CI 变红。
on:
  push:
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-scripts.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/bluegreen-static-test.sh
          /bin/bash deploy/tests/bluegreen-behavior-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
